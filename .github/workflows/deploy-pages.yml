# Despliega /docs a GitHub Pages.
# - Reconstruye thumbnails, imagenes optimizadas y catalog.json desde /images-source
#   con `node build.ts`, asi basta con subir imagenes nuevas a images-source/ y hacer push.
# - Publica el contenido de /docs con la accion oficial de Pages.
#
# Configuracion necesaria (una sola vez):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        # La version se toma del campo "packageManager" de package.json

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar catalogo, thumbnails e imagenes
        run: pnpm build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto (/docs)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
